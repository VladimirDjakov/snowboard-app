[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.40.0",
    "pydantic-settings>=2.0.0",
    "python-json-logger>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "rq>=2.6.1",
]

[project.scripts]
snowboard-worker = "backend.app.presentation.workers.rq.worker_entrypoint:main"

[project.optional-dependencies]
# Worker-specific dependencies are intentionally isolated here.
workers-cpu = [
    "jsonschema>=4.0.0",
]
workers-gpu = [
    "pyyaml>=6.0.0",
    # Pose stage (Ultralytics). For true CUDA acceleration in Linux containers,
    # install a CUDA-enabled PyTorch build in the image.
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "lap>=0.5.12",
]

[dependency-groups]
lint = [
    "ruff>=0.14.10",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
