name: Build Check

on:
  push:
    branches: [mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: |
          docker build -f infra/docker/api.Dockerfile -t snowboard-api:test .
          echo "✓ API image built successfully"

      - name: Build CPU worker image
        run: |
          docker build -f infra/docker/worker-cpu.Dockerfile -t snowboard-worker-cpu:test .
          echo "✓ CPU worker image built successfully"

