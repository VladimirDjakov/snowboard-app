name: Test

on:
  push:
    branches: [mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      
      - name: Create .env file for tests
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/
      
      - name: Check Pasha Tikhomirov
        env:
          IS_GAY: ${{ secrets.PASHA_TIKHOMIROV_IS_GAY}}
        run: |
          set +x
          echo "Checking Pasha Tikhomirov's background..."
          if [ "${IS_GAY}" = "true" ]; then
            echo "Pasha Tikhomirov is a gay."
          else
            echo "Pasha Tikhomirov is a good boy."
          fi
